name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the repo's postinstall, which shells out to bun for
      # `engine:install`. Without this step the install fails.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage ratchet
        # Coverage scope, reporters and thresholds live in vitest.config.ts.
        run: npm run test:coverage

      # Vitest writes no report when a suite fails (coverage.reportOnFailure is
      # off), so this is best-effort: it exists to browse the HTML on green runs
      # and to capture the text summary on threshold breaches.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
