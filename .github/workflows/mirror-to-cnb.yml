# 在 GitHub Release 发布后触发 CNB（cnb.cool）镜像流水线。
# GitHub Release 仍是权威产物源；CNB 复制同一 tag，供国内用户从
# cnb.cool 快速拉取安装包与源码（应用内自动更新源仍固定为 GitHub Releases）。
#
# 前置条件（未配置前本工作流会跳过镜像步骤，不影响发布）：
# 1. 在 cnb.cool 创建镜像仓库，并配置一条监听 `api_trigger_mirror` 事件的
#    流水线，流水线从 env.MIRROR_TAGS
#    读取要镜像的 tag，把 GitHub Release 的产物与 latest*.yml 复制为同一 tag；
# 2. 修改下方 CNB_BUILD_URL 为实际的 CNB 仓库构建入口；
# 3. 在 GitHub 仓库 Settings → Secrets and variables → Actions 配置
#    CNB_MIRROR_TOKEN（具有启动 CNB 流水线构建的权限）。
# 三项都就绪后，可将 trigger 步骤中"缺少密钥时跳过"改为硬失败（exit 1）。

name: Mirror to CNB

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'GitHub release tag to mirror (for example v0.8.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mirror-to-cnb-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger CNB mirror pipeline
    if: github.repository == 'hjdspace/SpaceCode'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # TODO: CNB 镜像仓库创建后替换为实际的组织/仓库名
      CNB_BUILD_URL: https://api.cnb.cool/hjdspace/SpaceCode/-/build/start
    steps:
      - name: Resolve release tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${INPUT_TAG:-}}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Need a GitHub release tag like v0.8.2 (got ${tag:-empty})"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Trigger CNB mirror pipeline
        env:
          CNB_MIRROR_TOKEN: ${{ secrets.CNB_MIRROR_TOKEN }}
          MIRROR_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if [[ -z "${CNB_MIRROR_TOKEN:-}" ]]; then
            echo "::warning::CNB_MIRROR_TOKEN not configured — skipping CNB mirror (domestic mirror not set up yet)"
            exit 0
          fi
          payload="$(jq -n --arg tag "$MIRROR_TAG" '{
            branch: "main",
            event: "api_trigger_mirror",
            sync: "false",
            title: ("mirror " + $tag),
            env: { MIRROR_TAGS: $tag }
          }')"
          echo "Starting CNB mirror for $MIRROR_TAG"
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -X POST "$CNB_BUILD_URL" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${CNB_MIRROR_TOKEN}" \
            --data "$payload"
          echo
