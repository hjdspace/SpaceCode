<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流水线看板 · SpaceCode</title>
<style>
  * { box-sizing: border-box; }
  svg { width: 16px; height: 16px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Inter, "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  ::selection { background: var(--accent-soft); }
  code, .mono { font-family: "JetBrains Mono", "SF Mono", Consolas, monospace; }

  /* ---------- tokens ---------- */
  [data-theme="light"] {
    --bg: #f8f9fb; --bg-2: #f0f1f5; --bg-3: #e7e9ef; --elev: #ffffff;
    --text: #18191f; --text-2: #44475a; --muted: #6e7191; --disabled: #9da1b8;
    --border: rgba(24,25,31,.09); --border-2: rgba(24,25,31,.15);
    --soft: rgba(24,25,31,.025); --soft-2: rgba(24,25,31,.045);
    --accent: #0d9488; --accent-hover: #14b8a6; --accent-soft: rgba(13,148,136,.11);
    --queued: #6e7191; --run: #0d9488; --review: #6366f1; --merge: #059669;
    --warn: #d97706; --danger: #dc2626;
    --lane-bg: rgba(24,25,31,.022);
    --card: #ffffff;
    --shadow-sm: 0 1px 2px rgba(24,25,31,.06);
    --shadow-md: 0 6px 18px rgba(24,25,31,.09);
    --shadow-lg: 0 20px 50px rgba(24,25,31,.16);
    --code-add: rgba(5,150,105,.12); --code-del: rgba(220,38,38,.10);
    --overlay: rgba(24,25,31,.34);
  }
  [data-theme="dark"] {
    --bg: #0d0d0d; --bg-2: #141414; --bg-3: #1a1a1a; --elev: #1f1f1f;
    --text: #f5f5f5; --text-2: #b0b0b0; --muted: #7a7a7a; --disabled: #525252;
    --border: rgba(255,255,255,.07); --border-2: rgba(255,255,255,.14);
    --soft: rgba(255,255,255,.03); --soft-2: rgba(255,255,255,.06);
    --accent: #3b82f6; --accent-hover: #60a5fa; --accent-soft: rgba(59,130,246,.16);
    --queued: #8a8a8a; --run: #3b82f6; --review: #818cf8; --merge: #34d399;
    --warn: #f59e0b; --danger: #f87171;
    --lane-bg: rgba(255,255,255,.022);
    --card: #181818;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 8px 22px rgba(0,0,0,.45);
    --shadow-lg: 0 24px 60px rgba(0,0,0,.65);
    --code-add: rgba(52,211,153,.13); --code-del: rgba(248,113,113,.12);
    --overlay: rgba(0,0,0,.55);
  }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-rows: 34px 1fr 26px; grid-template-columns: minmax(0, 1fr); height: 100%; min-width: 0; }
  .titlebar {
    display: flex; align-items: center; gap: 12px; padding: 0 12px;
    border-bottom: 1px solid var(--border); background: var(--bg-2);
    font-size: 11.5px; color: var(--muted); user-select: none;
  }
  .titlebar .brand { display: flex; align-items: center; gap: 7px; color: var(--text-2); font-weight: 600; letter-spacing: -.01em; }
  .brand-mark {
    width: 16px; height: 16px; border-radius: 4px; background: var(--accent);
    display: grid; place-items: center; color: #fff;
  }
  .brand-mark svg { width: 11px; height: 11px; }
  .titlebar .sep { width: 1px; height: 12px; background: var(--border-2); }
  .titlebar .crumb { display: flex; align-items: center; gap: 6px; }
  .titlebar .spacer { flex: 1; }
  .titlebar .hint { color: var(--disabled); }

  .body { display: flex; min-height: 0; min-width: 0; overflow: hidden; }

  /* rail */
  .rail {
    width: 50px; flex: 0 0 50px; border-right: 1px solid var(--border);
    background: var(--bg-2); display: flex; flex-direction: column; align-items: center;
    gap: 4px; padding: 10px 0; user-select: none;
  }
  .rail-btn {
    width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
    color: var(--muted); position: relative; transition: background .15s, color .15s;
  }
  .rail-btn:hover { background: var(--soft-2); color: var(--text); }
  .rail-btn.active { background: var(--accent-soft); color: var(--accent); }
  .rail-btn.active::before {
    content: ""; position: absolute; left: -8px; top: 9px; bottom: 9px; width: 2px;
    border-radius: 2px; background: var(--accent);
  }
  .rail-btn svg { width: 18px; height: 18px; }
  .rail .grow { flex: 1; }
  .rail-avatar {
    width: 26px; height: 26px; border-radius: 50%; background: var(--bg-3);
    border: 1px solid var(--border); display: grid; place-items: center;
    font-size: 10px; color: var(--text-2); margin-top: 6px;
  }

  /* center */
  .center { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .tabstrip {
    height: 34px; flex: 0 0 34px; display: flex; align-items: flex-end;
    gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--border);
    background: var(--bg-2); user-select: none;
  }
  .ctab {
    display: flex; align-items: center; gap: 7px; height: 27px; padding: 0 10px;
    border-radius: 7px 7px 0 0; color: var(--muted); font-size: 12px;
    border: 1px solid transparent; border-bottom: 0; position: relative; top: 1px;
  }
  .ctab.active { background: var(--bg); color: var(--text); border-color: var(--border); }
  .ctab .x { opacity: .5; display: grid; place-items: center; }
  .ctab .x:hover { opacity: 1; }
  .ctab-add { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); margin-bottom: 3px; }
  .ctab-add:hover { background: var(--soft-2); color: var(--text); }

  /* run header */
  .run-head { padding: 11px 16px 0; border-bottom: 1px solid var(--border); background: var(--bg); }
  .rh-row { display: flex; align-items: center; gap: 9px; min-height: 28px; }
  .rh-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .rh-title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.015em; white-space: nowrap; }
  .rh-title .repo { font-size: 11.5px; color: var(--muted); font-family: "JetBrains Mono", Consolas, monospace; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px;
    border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap;
    background: var(--soft-2); color: var(--text-2);
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.running { background: var(--accent-soft); color: var(--accent); }
  .pill.paused { background: rgba(217,119,6,.12); color: var(--warn); }
  .pill.stopped { background: var(--soft-2); color: var(--muted); }
  .rh-stats { display: flex; align-items: center; gap: 12px; margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .rh-stats b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .rh-actions { display: flex; align-items: center; gap: 5px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 27px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--elev); color: var(--text-2); font-size: 12px; font-weight: 500;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg-2); border-color: var(--border-2); color: var(--text); }
  .btn:active { transform: translateY(.5px); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: rgba(220,38,38,.08); border-color: rgba(220,38,38,.3); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--soft-2); color: var(--text); }
  .btn.sm { height: 24px; padding: 0 8px; font-size: 11.5px; border-radius: 6px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .icon-btn {
    width: 27px; height: 27px; border-radius: 7px; display: grid; place-items: center;
    color: var(--muted); transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: var(--soft-2); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }

  .pipeline { display: flex; align-items: center; gap: 3px; margin: 9px 0 7px; }
  .pseg {
    flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0;
    padding: 5px 8px; border-radius: 6px; color: var(--muted); font-size: 11px;
    position: relative; transition: background .15s, color .15s;
  }
  .pseg:hover { background: var(--soft-2); color: var(--text-2); }
  .pseg i { width: 6px; height: 6px; border-radius: 50%; background: var(--seg, var(--queued)); flex: 0 0 auto; }
  .pseg b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
  .pseg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pseg + .pseg::before {
    content: ""; position: absolute; left: -3px; top: 50%; width: 3px; height: 1px;
    background: var(--border-2);
  }
  .pseg.flash { animation: segflash .7s ease; }
  @keyframes segflash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }

  .attention {
    display: flex; align-items: center; gap: 9px; margin: 0 -16px; padding: 7px 16px;
    background: rgba(217,119,6,.07); border-top: 1px solid rgba(217,119,6,.16);
    color: var(--warn); font-size: 11.5px;
  }
  .attention .a-label { font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .attention .a-items { display: flex; gap: 6px; overflow: hidden; }
  .a-chip {
    display: flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px;
    border-radius: 999px; background: rgba(217,119,6,.13); color: var(--warn);
    font-size: 11px; white-space: nowrap; border: 1px solid rgba(217,119,6,.18);
  }
  .a-chip:hover { background: rgba(217,119,6,.22); }
  .a-chip .mono { font-size: 10.5px; opacity: .8; }

  /* board */
  .board-scroll { flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; }
  .board {
    display: grid; grid-auto-flow: column; grid-auto-columns: 236px;
    gap: 10px; padding: 12px 16px 16px; height: 100%; align-items: stretch;
    width: max-content; min-width: 100%;
  }
  .lane {
    --lane-color: var(--queued);
    display: flex; flex-direction: column; min-height: 0;
    background: var(--lane-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 7px 7px;
  }
  .lane::before {
    content: ""; height: 2px; border-radius: 2px; background: var(--lane-color);
    opacity: .7; margin: 0 -7px 7px; border-radius: 10px 10px 0 0;
  }
  .lane-head { display: flex; align-items: center; gap: 7px; padding: 2px 5px 9px; }
  .lane-head i { width: 6px; height: 6px; border-radius: 50%; background: var(--lane-color); }
  .lane-head span { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: -.01em; }
  .lane-head b { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .lane-cards { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; padding: 1px 1px 2px; min-height: 0; }
  .lane-empty {
    border: 1px dashed var(--border-2); border-radius: 8px; padding: 18px 8px;
    text-align: center; color: var(--disabled); font-size: 11px;
  }

  /* cards */
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 10px 9px; box-shadow: var(--shadow-sm); cursor: pointer;
    transition: border-color .15s, box-shadow .15s, transform .12s;
    position: relative; flex: 0 0 auto;
  }
  .card:hover { border-color: var(--border-2); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-soft), var(--shadow-md); }
  .card.blocked { border-color: rgba(217,119,6,.28); }
  .card.blocked.selected { border-color: var(--warn); box-shadow: 0 0 0 1px rgba(217,119,6,.15); }
  .card.cancelled { opacity: .62; }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .cdot { width: 7px; height: 7px; border-radius: 50%; background: var(--lane-color, var(--queued)); flex: 0 0 auto; }
  .cdot.pulse { animation: pulse 1.9s ease-out infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--lane-color) 45%, transparent); }
    70% { box-shadow: 0 0 0 6px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  .card .num { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; color: var(--muted); }
  .chip {
    display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px;
    font-size: 10px; font-weight: 500; background: var(--soft-2); color: var(--muted); white-space: nowrap;
  }
  .chip.accent { background: var(--accent-soft); color: var(--accent); }
  .chip.warn { background: rgba(217,119,6,.13); color: var(--warn); }
  .chip.ok { background: rgba(5,150,105,.12); color: var(--merge); }
  .chip.review { background: rgba(99,102,241,.12); color: var(--review); }
  .card .more { margin-left: auto; width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; color: var(--disabled); opacity: 0; transition: opacity .15s, background .15s; }
  .card:hover .more { opacity: 1; }
  .card .more:hover { background: var(--soft-2); color: var(--text); }
  .card h3 {
    margin: 0 0 6px; font-size: 12.5px; line-height: 1.4; font-weight: 550;
    letter-spacing: -.005em; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card .branch {
    display: flex; align-items: center; gap: 4px; font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; margin-bottom: 7px;
  }
  .card .branch svg { width: 11px; height: 11px; flex: 0 0 auto; opacity: .7; }
  .progress { height: 3px; border-radius: 3px; background: var(--soft-2); overflow: hidden; margin: 2px 0 7px; }
  .progress i { display: block; height: 100%; border-radius: 3px; background: var(--lane-color, var(--accent)); transition: width .4s ease; }
  .card-foot { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); }
  .diffstat { display: inline-flex; gap: 4px; font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; }
  .diffstat b { color: var(--merge); font-weight: 500; }
  .diffstat em { color: var(--danger); font-style: normal; }
  .card-foot .spacer { flex: 1; }
  .card-foot .model { font-size: 10px; }
  .card-alert {
    display: flex; align-items: flex-start; gap: 6px; margin: 7px 0 6px; padding: 6px 7px;
    border-radius: 6px; background: rgba(217,119,6,.08); color: var(--warn);
    font-size: 10.5px; line-height: 1.45;
  }
  .card-alert svg { width: 12px; height: 12px; flex: 0 0 auto; margin-top: 1px; }
  .card-actions { display: flex; gap: 5px; margin-top: 8px; }
  .card-actions .btn { flex: 1; }
  .card-actions .btn.ghost { flex: 0 0 auto; }
  .takeover-badge {
    position: absolute; top: 7px; right: 7px; height: 17px; padding: 0 6px; border-radius: 999px;
    background: var(--text); color: var(--bg); font-size: 9.5px; display: flex; align-items: center; gap: 4px;
  }

  /* inspector */
  .inspector {
    width: 396px; flex: 0 0 396px; border-left: 1px solid var(--border);
    background: var(--bg); display: flex; flex-direction: column; min-height: 0;
    transition: width .2s ease, flex-basis .2s ease, opacity .2s ease;
  }
  .shell.inspector-closed .inspector { width: 0; flex-basis: 0; opacity: 0; overflow: hidden; border-left: 0; }
  .ins-head { padding: 11px 14px 0; border-bottom: 1px solid var(--border); }
  .ins-top { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .ins-top .num { font-family: "JetBrains Mono", Consolas, monospace; font-size: 11px; color: var(--muted); }
  .ins-top .spacer { flex: 1; }
  .ins-title { margin: 0 0 8px; font-size: 14px; line-height: 1.4; font-weight: 600; letter-spacing: -.01em; }
  .ins-meta { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
  .meta-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--muted); min-width: 0; }
  .meta-row svg { width: 12px; height: 12px; flex: 0 0 auto; opacity: .75; }
  .meta-row code { font-size: 10px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .copy-btn { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: var(--disabled); flex: 0 0 auto; }
  .copy-btn:hover { background: var(--soft-2); color: var(--text); }
  .copy-btn svg { width: 11px; height: 11px; }

  .railsteps { display: flex; align-items: flex-start; padding: 4px 2px 10px; }
  .step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; min-width: 0; }
  .step::after {
    content: ""; position: absolute; top: 7px; left: calc(50% + 8px); right: calc(-50% + 8px);
    height: 1px; background: var(--border-2);
  }
  .step:last-child::after { display: none; }
  .step .sdot {
    width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--border-2); background: var(--bg); color: transparent;
    position: relative; z-index: 1;
  }
  .step .sdot svg { width: 8px; height: 8px; }
  .step .slabel { font-size: 9.5px; color: var(--muted); white-space: nowrap; }
  .step.done .sdot { background: var(--merge); border-color: var(--merge); color: #fff; }
  .step.done::after { background: color-mix(in srgb, var(--merge) 40%, var(--border-2)); }
  .step.active .sdot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .step.active .sdot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .step.active .slabel { color: var(--accent); font-weight: 600; }
  .step.blocked .sdot { border-color: var(--warn); background: var(--warn); color: #fff; }
  .step.blocked .slabel { color: var(--warn); font-weight: 600; }

  .tabs { display: flex; gap: 1px; padding: 0 2px; }
  .itab {
    position: relative; height: 29px; padding: 0 8px; display: flex; align-items: center; gap: 5px;
    color: var(--muted); font-size: 11.5px; border-bottom: 2px solid transparent;
  }
  .itab:hover { color: var(--text); }
  .itab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 550; }
  .itab .badge { font-size: 9.5px; padding: 0 5px; height: 15px; border-radius: 999px; background: var(--soft-2); color: var(--muted); display: inline-flex; align-items: center; }
  .itab.active .badge { background: var(--accent-soft); color: var(--accent); }

  .ins-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 14px; }
  .ins-foot { border-top: 1px solid var(--border); padding: 9px 12px; display: flex; gap: 6px; background: var(--bg); }
  .ins-foot .btn { flex: 1; }
  .ins-foot .btn.ghost { flex: 0 0 auto; }
  .ins-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); padding: 30px; text-align: center; }
  .ins-empty svg { width: 28px; height: 28px; opacity: .4; }
  .ins-empty p { margin: 0; font-size: 12px; line-height: 1.6; }

  .section { margin-bottom: 13px; }
  .section:last-child { margin-bottom: 0; }
  .section-title { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin: 0 0 6px; text-transform: uppercase; }
  .goal { font-size: 12px; line-height: 1.65; color: var(--text-2); background: var(--soft); border: 1px solid var(--border); border-radius: 7px; padding: 8px 9px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .metric { background: var(--soft); border: 1px solid var(--border); border-radius: 7px; padding: 7px 8px; }
  .metric span { display: block; font-size: 9.5px; color: var(--muted); margin-bottom: 3px; }
  .metric b { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric b.ok { color: var(--merge); }
  .metric b.bad { color: var(--danger); }
  .kv { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 11px; }
  .kv:last-child { border-bottom: 0; }
  .kv span { color: var(--muted); }
  .kv b { font-weight: 550; color: var(--text-2); font-family: "JetBrains Mono", Consolas, monospace; font-size: 10.5px; }
  .commit { display: flex; gap: 7px; padding: 5px 0; font-size: 11px; }

  /* timeline */

  .tl-dot {

  /* diff */

  /* setup wizard */

  .wizard-head { display: flex; align-items: flex-start; gap: 10px; }

  .wizard-head p { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .wizard-head .repo { margin-left: auto; font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; color: var(--text-2); background: var(--soft-2); padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
  .stepper { display: flex; align-items: center; margin: 18px 0 14px; }

  .panel { background: var(--elev); border: 1px solid var(--border); border-radius: 11px; padding: 15px 17px; margin-bottom: 11px; box-shadow: var(--shadow-sm); }

  .guide { margin-top: 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); overflow: hidden; }
  .guide-head { display: flex; align-items: center; gap: 6px; width: 100%; padding: 8px 10px; font-size: 10.5px; color: var(--text-2); text-align: left; }
  .guide-head:hover { background: var(--soft-2); }

  .perm-grid { display: grid; grid-template-columns: 1.1fr .8fr 1.1fr; gap: 2px 8px; font-size: 9.5px; margin: 7px 0; padding: 7px 8px; background: var(--bg-2); border-radius: 6px; font-family: "JetBrains Mono", Consolas, monospace; }

  .test-result { margin-top: 8px; border-radius: 8px; padding: 9px 10px; border: 1px solid var(--border); font-size: 10.5px; line-height: 1.55; }

  .tr-title { display: flex; align-items: center; gap: 5px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }

  .reuse-row { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--soft); margin-top: 9px; }

    background: var(--bg-2); color: var(--muted); font-size: 10.5px; user-select: none;
  }

  .sb-btn { height: 19px; padding: 0 6px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }

  /* modal */
  .modal-backdrop { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(2px); animation: fade .15s ease; z-index: 40; }
  .modal {
    position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(620px, calc(100vw - 48px)); max-height: min(82vh, 760px);
    background: var(--elev); border: 1px solid var(--border-2); border-radius: 12px;
    box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
    animation: pop .18s cubic-bezier(.2,.9,.3,1.1);
  }
  .modal.wide { width: min(760px, calc(100vw - 48px)); }
  .modal.chat { width: min(720px, calc(100vw - 48px)); height: min(600px, 82vh); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%) scale(.98); } }
  .m-head { display: flex; align-items: flex-start; gap: 9px; padding: 14px 16px 11px; border-bottom: 1px solid var(--border); }

  table.cfg th { text-align: left; font-size: 9.5px; color: var(--muted); font-weight: 500; padding: 0 6px 6px; border-bottom: 1px solid var(--border); }

  table.cfg tr:last-child td { border-bottom: 0; }
  table.cfg select { height: 24px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); font-size: 10.5px; padding: 0 4px; }
  .switch { position: relative; width: 28px; height: 16px; border-radius: 999px; background: var(--border-2); display: inline-block; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(12px); }

  /* takeover chat */
  .takeover-head { display: flex; align-items: center; gap: 9px; padding: 11px 14px; border-bottom: 1px solid var(--border); }
  .takeover-head .th-title { min-width: 0; }
  .takeover-head h2 { margin: 0; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .takeover-head p { margin: 2px 0 0; font-size: 10px; color: var(--muted); font-family: "JetBrains Mono", Consolas, monospace; }
  .takeover-head .spacer { flex: 1; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .sys-note { align-self: center; font-size: 10px; color: var(--muted); background: var(--soft-2); padding: 4px 9px; border-radius: 999px; }
  .msg { display: flex; gap: 8px; max-width: 86%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 22px; height: 22px; border-radius: 6px; flex: 0 0 auto; display: grid; place-items: center; font-size: 9px; font-weight: 600; background: var(--soft-2); color: var(--muted); }
  .msg.agent .avatar { background: var(--accent-soft); color: var(--accent); }
  .bubble { background: var(--soft); border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px; font-size: 11.5px; line-height: 1.6; color: var(--text-2); }
  .msg.user .bubble { background: var(--accent-soft); border-color: transparent; color: var(--text); }
  .bubble code { font-size: 10.5px; color: var(--accent); }
  .chat-input { display: flex; gap: 7px; padding: 10px 14px; border-top: 1px solid var(--border); align-items: flex-end; }
  .chat-input textarea { flex: 1; resize: none; height: 34px; max-height: 90px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); padding: 8px 9px; font-size: 11.5px; line-height: 1.5; outline: none; }
  .chat-input textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  /* toast */
  #toast-root { position: fixed; right: 16px; bottom: 38px; display: flex; flex-direction: column; gap: 7px; z-index: 60; pointer-events: none; }
  .toast {
    display: flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 8px;
    background: var(--text); color: var(--bg); font-size: 11.5px; box-shadow: var(--shadow-md);
    animation: toastin .22s ease; max-width: 360px;
  }
  .toast svg { width: 13px; height: 13px; flex: 0 0 auto; }
  .toast.out { opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; }
  @keyframes toastin { from { opacity: 0; transform: translateY(6px); } }

  /* scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--disabled); background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   工具
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const icon = (name, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const laneOf = (key) => LANES.find(l => l.key === key) || LANES[0];
const taskById = (id) => state.tasks.find(t => t.id === id);
const isAttention = (t) => t.lane === 'blocked' || (t.lane === 'reviewing' && t.review && t.review.verdict === 'needs_changes');
const openComments = (t) => t.review ? t.review.comments.filter(c => c.status === 'open').length : 0;

function laneStatusText(t) {
  switch (t.lane) {
    case 'queued': return '排队中';
    case 'implementing': return `迭代 ${t.iteration}/${t.maxIter}`;
    case 'reviewing': return `${openComments(t)} 条意见`;
    case 'mergeable': return '待批准';
    case 'blocked': return '需处理';
    case 'done': return t.cancelled ? '已取消' : '已合并';
  }
  return '';
}

/* ============================================================
   渲染：运行头部
   ============================================================ */
function countByLane(key) { return state.tasks.filter(t => t.lane === key).length; }

function renderChrome() {
  const att = state.tasks.filter(isAttention);
  const running = countByLane('implementing') + countByLane('reviewing');
  const statusPill = state.run.status === 'running'
    ? (state.paused
        ? `<span class="pill paused"><span class="dot"></span>已暂停</span>`
        : `<span class="pill running"><span class="dot"></span>运行中</span>`)
    : `<span class="pill stopped"><span class="dot"></span>已停止</span>`;

  const segs = SEGMENTS.map(s => `
    <button class="pseg" data-action="focus-lane" data-lane="${s.key}" style="--seg:${s.color}">
      <i></i><span>${s.label}</span><b>${countByLane(s.key)}</b>
    </button>`).join('');

  const attHTML = att.length ? `
    <div class="attention">
      <span class="a-label">${icon('alert')}需你处理 ${att.length}</span>
      <div class="a-items">
        ${att.map(t => `<button class="a-chip" data-action="select" data-id="${t.id}">
          <span class="mono">#${t.num}</span>
          <span>${t.lane === 'blocked' ? '合并冲突' : '审查待处理'}</span>
        </button>`).join('')}
      </div>
    </div>` : '';

  $('#run-head').innerHTML = `
    <div class="rh-row">
      <div class="rh-title">
        <h1>流水线</h1>
        <span class="repo">hjdspace/SpaceCode</span>
        ${statusPill}
        <span class="pill">run #${state.run.id}</span>
      </div>
      <div class="rh-stats">
        <span>并发 <b id="stat-running">${running}</b>/<b>${state.run.maxConcurrency}</b></span>
        <span>花费 <b id="stat-spend">$${state.run.spend.toFixed(2)}</b></span>
        <span>用时 <b id="stat-elapsed">${Math.floor(state.run.runElapsed / 60)}m</b></span>
      </div>
      <div class="rh-actions">
        <button class="btn sm" data-action="toggle-run">${state.paused || state.run.status !== 'running' ? icon('play') + '继续' : icon('pause') + '暂停'}</button>
        <button class="btn sm danger" data-action="stop-run">${icon('stop')}停止</button>
        <button class="btn sm" data-action="config">${icon('sliders')}配置</button>
        <button class="btn sm primary" data-action="new-run">${icon('plus')}新建运行</button>
      </div>
    </div>
    <div class="pipeline">${segs}</div>
    ${attHTML}
  `;
}

/* ============================================================
   渲染：看板
   ============================================================ */
function cardActions(t) {
  const id = t.id;
  if (t.lane === 'queued') return `<button class="btn sm primary" data-action="start-task" data-id="${id}">${icon('play')}立即开始</button><button class="btn sm ghost" data-action="select" data-id="${id}">详情</button>`;
  if (t.lane === 'implementing') return `<button class="btn sm" data-action="takeover" data-id="${id}">${icon('chat')}接管</button><button class="btn sm ghost" data-action="select" data-id="${id}">详情</button>`;
  if (t.lane === 'reviewing') return `<button class="btn sm" data-action="select" data-id="${id}">${icon('eye')}审查</button><button class="btn sm ghost" data-action="takeover" data-id="${id}">接管</button>`;
  if (t.lane === 'mergeable') return `<button class="btn sm primary" data-action="merge" data-id="${id}">${icon('merge')}合并</button><button class="btn sm ghost" data-action="select" data-id="${id}">详情</button>`;
  if (t.lane === 'blocked') return `<button class="btn sm primary" data-action="fix-agent" data-id="${id}">${icon('sparkles')}让 Agent 修</button><button class="btn sm ghost" data-action="cancel-task" data-id="${id}">放弃</button>`;
  return `<button class="btn sm ghost" data-action="select" data-id="${id}">${icon('eye')}查看</button>`;
}

function renderCard(t) {
  const lane = laneOf(t.lane);
  const selected = state.selectedId === t.id ? ' selected' : '';
  const blocked = t.lane === 'blocked' ? ' blocked' : '';
  const cancelled = t.cancelled ? ' cancelled' : '';
  const pulse = (t.lane === 'implementing' && !state.paused && state.run.status === 'running') ? ' pulse' : '';
  const pct = t.maxIter ? Math.min(100, Math.round(t.iteration / t.maxIter * 100)) : 0;
  const diff = t.diff.a || t.diff.d
    ? `<span class="diffstat"><b>+${t.diff.a}</b><em>−${t.diff.d}</em></span>`
    : `<span class="diffstat" style="color:var(--disabled)">—</span>`;
  const meta = t.lane === 'done'
    ? `<span class="model">${t.mergedAt ? '合并于 ' + t.mergedAt : '已完成'} · ${t.mergedCommits || t.commits.length} commits</span>`
    : `<span class="model">${t.model} · <span data-elapsed-id="${t.id}">${fmt(t.elapsed)}</span></span>`;
  const chipCls = t.lane === 'blocked' ? 'warn' : t.lane === 'reviewing' ? 'review' : t.lane === 'done' ? 'ok' : t.lane === 'implementing' ? 'accent' : '';
  const alert = t.lane === 'blocked' && t.attention
    ? `<div class="card-alert">${icon('alert')}<span>${t.attention.reason}</span></div>` : '';
  const takeover = state.takeoverId === t.id ? `<span class="takeover-badge">${icon('chat')}已接管</span>` : '';
  const progress = (t.lane === 'implementing' || t.lane === 'reviewing') && !t.cancelled
    ? `<div class="progress"><i style="width:${t.lane === 'reviewing' ? 100 : pct}%"></i></div>` : '';

  return `
    <article class="card${selected}${blocked}${cancelled}" data-action="select" data-id="${t.id}" tabindex="0" role="button" aria-label="任务 ${t.num} ${t.title}" style="--lane-color:${lane.color}">
      ${takeover}
      <div class="card-top">
        <span class="cdot${pulse}"></span>
        <span class="num">#${t.num}</span>
        <span class="chip ${chipCls}">${laneStatusText(t)}</span>
        <button class="more" title="更多" data-action="select" data-id="${t.id}">${icon('more')}</button>
      </div>
      <h3>${t.title}</h3>
      <div class="branch">${icon('branch')}<span>${t.branch}</span></div>
      ${progress}
      ${alert}
      <div class="card-foot">
        ${diff}
        <span class="spacer"></span>
        ${meta}
      </div>
      <div class="card-actions">${cardActions(t)}</div>
    </article>`;
}

function renderBoard() {
  const board = $('#board');
  board.innerHTML = LANES.map(lane => {
    const items = state.tasks.filter(t => t.lane === lane.key);
    return `
      <section class="lane" data-lane="${lane.key}" style="--lane-color:${lane.color}">
        <div class="lane-head"><i></i><span>${lane.name}</span><b>${items.length}</b></div>
        <div class="lane-cards">
          ${items.length ? items.map(renderCard).join('') : `<div class="lane-empty">暂无任务</div>`}
        </div>
      </section>`;
  }).join('');
}

/* ============================================================
   渲染：检查器
   ============================================================ */
function stepState(t, idx) {
  if (t.lane === 'queued') return 'pending';
  if (t.lane === 'done') return 'done';
  if (t.lane === 'blocked' && idx === t.stageIdx) return 'blocked';
  if (idx < t.stageIdx) return 'done';
  if (idx === t.stageIdx) return 'active';
  return 'pending';
}

function stageRail(t) {
  return `<div class="railsteps">${STEPS.map((label, idx) => {
    const st = stepState(t, idx);
    return `<div class="step ${st}" title="${label}">
      <span class="sdot">${st === 'done' ? icon('check') : st === 'blocked' ? icon('x') : ''}</span>
      <span class="slabel">${label}</span>
    </div>`;
  }).join('')}</div>`;
}

function timeline(t) {
  const items = t.events.map(e => `
    <div class="tl-item ${e.kind}">
      <span class="tl-dot"></span>
      <div class="tl-time">${e.time}</div>
      <div class="tl-text">${e.text}</div>
    </div>`).join('');
  const live = (t.lane === 'implementing' && !state.paused && state.run.status === 'running')
    ? `<div class="tl-item run"><span class="tl-dot"></span><div class="tl-live"><i></i>Agent 正在执行</div></div>` : '';
  return `<div class="timeline">${items}${live}</div>`;
}

function overview(t) {
  const open = openComments(t);
  return `
    <div class="section">
      <h4 class="section-title">任务目标</h4>
      <div class="goal">${t.goal}</div>
    </div>
    <div class="section">
      <h4 class="section-title">本次运行</h4>
      <div class="metrics">
        <div class="metric"><span>提交</span><b>${t.commits.length}</b></div>
        <div class="metric"><span>变更</span><b>+${t.diff.a} −${t.diff.d}</b></div>
        <div class="metric"><span>用时</span><b>${t.elapsed ? fmt(t.elapsed) : '—'}</b></div>
      </div>
    </div>
    <div class="section">
      <h4 class="section-title">阶段产物</h4>
      <div class="kv"><span>分支</span><b>${t.branch.replace('agent/', '')}</b></div>
      <div class="kv"><span>工作树</span><b>${t.worktree}</b></div>
      <div class="kv"><span>引擎</span><b>${t.model}</b></div>
      <div class="kv"><span>验证</span><b style="color:${t.tests ? (t.tests.status === 'pass' ? 'var(--merge)' : 'var(--danger)') : 'var(--muted)'}">${t.tests ? (t.tests.status === 'pass' ? '通过' : '失败') + ' · ' + t.tests.detail : '待运行'}</b></div>
      <div class="kv"><span>审查</span><b>${t.review ? (t.review.verdict === 'approved' ? '通过' : open + ' 条待处理') : '待审查'}</b></div>
    </div>
    ${t.commits.length ? `<div class="section">
      <h4 class="section-title">提交</h4>
      ${t.commits.map(c => `<div class="commit"><code>${c.sha}</code><span>${c.msg}</span></div>`).join('')}
    </div>` : ''}
    ${t.review ? `<div class="section">
      <h4 class="section-title">审查结论</h4>
      <div class="verdict ${t.review.verdict === 'approved' ? 'ok' : 'needs'}">
        ${icon(t.review.verdict === 'approved' ? 'check' : 'alert')}
        <div><b>${t.review.verdict === 'approved' ? '审查通过' : '需要修改'}</b><p>${t.review.summary}</p></div>
      </div>
    </div>` : ''}
  `;
}

function diffView(t) {
  if (!t.diffLines.length) return `<div class="empty">${icon('file')}<div>该任务暂无 diff</div></div>`;
  return `
    <div class="filelist">
      ${t.diffFiles.map((f, i) => `<div class="frow${i === 0 ? ' active' : ''}" title="${f.path}">
        ${icon('file')}<code>${f.path}</code><span class="spacer"></span>
        <span class="diffstat"><b>+${f.a}</b><em>−${f.d}</em></span>
      </div>`).join('')}
    </div>
    <div class="diffbox">
      ${t.diffLines.map(l => `<div class="dline ${l.t}"><span class="ln">${l.no}</span><span class="code">${escapeHTML(l.text)}</span></div>`).join('')}
    </div>`;
}

function reviewView(t) {
  if (!t.review) return `<div class="empty">${icon('shield')}<div>该任务尚未进入审查阶段</div></div>`;
  const verdict = t.review.verdict === 'approved';
  return `
    <div class="verdict ${verdict ? 'ok' : 'needs'}">
      ${icon(verdict ? 'check' : 'alert')}
      <div><b>${verdict ? '审查通过' : '需要修改'}</b><p>${t.review.summary}</p></div>
    </div>
    ${t.review.comments.map((c, i) => `
      <div class="comment ${c.status !== 'open' ? 'resolved' : ''}">
        <div class="c-head"><code>${c.file}:${c.line}</code><span class="spacer"></span>
          <span class="chip ${c.status === 'open' ? 'warn' : 'ok'}">${c.status === 'open' ? '待处理' : c.status === 'accepted' ? '已修复' : '已忽略'}</span>
        </div>
        <div class="c-body">${c.body}</div>
        ${c.status === 'open' ? `<div class="c-actions">
          <button class="btn sm" data-action="address-comment" data-id="${t.id}" data-comment="${i}">${icon('sparkles')}让 Agent 修</button>
          <button class="btn sm ghost" data-action="dismiss-comment" data-id="${t.id}" data-comment="${i}">忽略</button>
        </div>` : ''}
      </div>`).join('') || `<div class="empty">没有行内意见</div>`}
  `;
}

function footerActions(t) {
  if (t.lane === 'queued') return `<button class="btn primary" data-action="start-task" data-id="${t.id}">${icon('play')}立即开始</button><button class="btn ghost" data-action="cancel-task" data-id="${t.id}">移除</button>`;
  if (t.lane === 'implementing') return `<button class="btn primary" data-action="takeover" data-id="${t.id}">${icon('chat')}接管会话</button><button class="btn ghost" data-action="open-worktree" data-id="${t.id}">${icon('external')}工作树</button>`;
  if (t.lane === 'reviewing') return `<button class="btn primary" data-action="fix-agent" data-id="${t.id}">${icon('sparkles')}让 Agent 修</button><button class="btn" data-action="approve-review" data-id="${t.id}">${icon('check')}批准</button>`;
  if (t.lane === 'mergeable') return `<button class="btn primary" data-action="merge" data-id="${t.id}">${icon('merge')}合并到 main</button><button class="btn ghost" data-action="open-worktree" data-id="${t.id}">${icon('external')}工作树</button>`;
  if (t.lane === 'blocked') return `<button class="btn primary" data-action="fix-agent" data-id="${t.id}">${icon('sparkles')}让 Agent 修</button><button class="btn ghost" data-action="cancel-task" data-id="${t.id}">放弃</button>`;
  return `<button class="btn" data-action="open-worktree" data-id="${t.id}">${icon('external')}查看工作树</button>`;
}

function renderInspector() {
  const ins = $('#inspector');
  const t = taskById(state.selectedId);
  if (!t) {
    ins.innerHTML = `<div class="ins-empty">${icon('layers')}<p>从看板选择一个任务<br>查看阶段、日志、Diff 与审查意见</p></div>`;
    return;
  }
  const reviewCount = t.review ? t.review.comments.length : 0;
  const body = state.tab === 'overview' ? overview(t)
    : state.tab === 'events' ? timeline(t)
    : state.tab === 'diff' ? diffView(t)
    : reviewView(t);

  ins.innerHTML = `
    <div class="ins-head">
      <div class="ins-top">
        <span class="num">#${t.num}</span>
        <span class="chip ${t.lane === 'blocked' ? 'warn' : t.lane === 'reviewing' ? 'review' : t.lane === 'done' ? 'ok' : 'accent'}">${laneStatusText(t)}</span>
        <span class="spacer"></span>
        <button class="icon-btn" data-action="close-inspector" title="关闭检查器">${icon('x')}</button>
      </div>
      <h2 class="ins-title">${t.title}</h2>
      <div class="ins-meta">
        <div class="meta-row">${icon('branch')}<code>${t.branch}</code><button class="copy-btn" data-action="copy" data-copy="${t.branch}" data-label="分支名" title="复制分支名">${icon('copy')}</button></div>
        <div class="meta-row">${icon('folder')}<code>${t.worktree}</code></div>
        <div class="meta-row">${icon('cpu')}<code>${t.model}</code><span style="opacity:.6">·</span><span>permissionMode acceptEdits</span></div>
      </div>
      ${stageRail(t)}
      <div class="tabs">
        <button class="itab ${state.tab === 'overview' ? 'active' : ''}" data-action="tab" data-tab="overview">概览</button>
        <button class="itab ${state.tab === 'events' ? 'active' : ''}" data-action="tab" data-tab="events">事件流</button>
        <button class="itab ${state.tab === 'diff' ? 'active' : ''}" data-action="tab" data-tab="diff">Diff <span class="badge">${t.diffFiles.length}</span></button>
        <button class="itab ${state.tab === 'review' ? 'active' : ''}" data-action="tab" data-tab="review">审查 <span class="badge">${reviewCount}</span></button>
      </div>
    </div>
    <div class="ins-body" id="ins-body">${body}</div>
    <div class="ins-foot">${footerActions(t)}</div>
  `;
  if (state.tab === 'events') {
    const b = $('#ins-body');
    b.scrollTop = b.scrollHeight;
  }
}

function preflightItems() {
  const s = state.setup;
  const items = [];
  items.push({ kind: 'ok', label: 'Git 仓库 · 工作区干净' });
  items.push(s.agent === 'claude-code'
    ? { kind: 'ok', label: '引擎 Claude Code 已连接' }
    : { kind: 'warn', label: 'Pi 引擎未配置', link: { label: '去配置', action: 'setup-step', step: 1 } });
  if (s.sandbox === 'worktree') {
    items.push({ kind: 'ok', label: 'worktree 目录可写' });
  } else if (s.sandbox === 'docker') {
    items.push(s.dockerStatus === 'running'
      ? { kind: 'warn', label: 'Docker 已运行 · 容器内模型凭据需单独配置', link: { label: '查看说明', action: 'setup-step', step: 2 } }
      : { kind: 'err', label: 'Docker Desktop 未运行', link: { label: '重新检测', action: 'retry-docker' } });
  } else {
    items.push({ kind: 'err', label: 'Podman 未安装', link: { label: '返回选择', action: 'setup-step', step: 2 } });
  }
  if (s.tracker === 'github') {
    if (s.authMethod === 'gh') {
      items.push(s.ghStatus === 'ok'
        ? { kind: 'ok', label: 'gh CLI 已登录' }
        : { kind: 'err', label: 'gh CLI 未登录', link: { label: '回到第 3 步', action: 'setup-step', step: 3 } });
    } else {
      items.push(s.tokenStatus === 'ok'
        ? { kind: 'ok', label: 'GitHub 身份 @hjdspace' }
        : { kind: 'err', label: 'GitHub 凭据未验证', link: { label: '回到第 3 步', action: 'setup-step', step: 3 } });
    }
    items.push({ kind: 'ok', label: `领取标签 ${s.label}` });
  } else {
    items.push({ kind: 'ok', label: '本地 backlog · 无需凭据' });
  }
  items.push({ kind: 'ok', label: '验证命令 npm run test:changed' });
  return items;
}

  const s = state.setup;
  const items = preflightItems();
  const blocking = items.some(i => i.kind === 'err');
  const agentLabel = s.agent === 'claude-code' ? 'Claude Code' : 'Pi Engine';
  const sandboxLabel = s.sandbox === 'worktree' ? '本地 worktree' : s.sandbox === 'docker' ? 'Docker' : 'Podman';
  const trackerLabel = s.tracker === 'github' ? 'GitHub Issues' : '本地 backlog';
  return `<div class="panel">

function renderSetup() {
  const el = $('#setup-view');
  if (!el) return;
  const s = state.setup;
  if (s.done) {
    el.innerHTML = setupDoneView();
    return;
  }
  const blocking = state.setupStep === 4 && preflightItems().some(i => i.kind === 'err');
  el.innerHTML = `<div class="setup-wrap">
    <div class="wizard-head">
      <div><h1>配置流水线</h1><p>初始化一次即可复用；之后可在运行头部「配置」里重新进入。</p></div>
      <span class="repo">hjdspace/SpaceCode</span>
    </div>
    ${setupStepper()}
    ${state.setupStep === 1 ? setupStepOne()
      : state.setupStep === 2 ? setupStepTwo()
      : state.setupStep === 3 ? setupStepThree()
      : setupStepFour()}
    <div class="setup-foot">
      <span class="step-label">第 ${state.setupStep} / 4 步</span>
      <span class="spacer"></span>
      ${state.setupStep > 1 ? `<button class="btn" data-action="setup-prev">上一步</button>` : ''}
      ${state.setupStep < 4
        ? `<button class="btn primary" data-action="setup-next">下一步${icon('arrow-right')}</button>`
        : `<button class="btn primary" data-action="setup-complete" ${blocking ? 'disabled' : ''}>${icon('check')}完成配置</button>`}
    </div>
  </div>`;
  const input = $('#gh-token');
  if (input) input.value = s.token;
}

function testToken() {
  const s = state.setup;
  if (!s.token.trim()) {
    s.tokenStatus = 'error';
    s.tokenError = '请先粘贴 token';
    renderSetup();
    return;
  }
  s.tokenStatus = 'testing';
  s.tokenError = '';
  renderSetup();
  setTimeout(() => {
    if (/^(github_pat_|ghp_)/.test(s.token.trim())) {
      s.tokenStatus = 'ok';
      s.tokenIdentity = '@hjdspace';
      s.tokenIssues = 12;
      s.tokenLabelCount = 3;
      toast('GitHub 连接成功', 'success');
    } else {
      s.tokenStatus = 'error';
      s.tokenError = '401 Bad credentials · token 无效或已过期';
    }
    renderSetup();
  }, 800);
}

function checkGh() {
  const s = state.setup;
  s.ghStatus = 'checking';
  renderSetup();
  setTimeout(() => {
    s.ghStatus = 'error';
    s.ghError = 'gh 未登录。先在终端运行 gh auth login，或改用 Personal access token。';
    renderSetup();
  }, 700);
}

function completeSetup() {
  const blocking = preflightItems().some(i => i.kind === 'err');
  if (blocking) {
    toast('还有预检项未通过', 'warn');
    return;
  }
  state.setup.done = true;
  renderSetup();
  toast('流水线配置已保存', 'success');
}

function refreshAll() {
  renderTabs();
  renderChrome();
  renderBoard();
  renderInspector();
  const center = document.querySelector('.center');
  if (center) center.classList.toggle('setup-mode', state.view === 'setup');
  if (state.view === 'setup') renderSetup();
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function selectTask(id, tab) {
  state.selectedId = id;
  state.inspectorOpen = true;
  if (tab) state.tab = tab;
  $('#shell').classList.remove('inspector-closed');
  renderBoard();
  renderInspector();
}

function toast(msg, kind = 'default') {
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = icon(kind === 'success' ? 'check' : kind === 'warn' ? 'alert' : 'zap') + `<span>${msg}</span>`;
  root.appendChild(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3100);
}

function addEvent(t, kind, text) {
  t.events.push(ev(clock(), kind, text));
  if (t.events.length > 40) t.events.shift();
}

function moveTask(t, lane, stageIdx) {
  t.lane = lane;
  t.stageIdx = stageIdx;
}

function focusLane(key) {
  const el = $(`.lane[data-lane="${key}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
  const seg = $(`.pseg[data-lane="${key}"]`);
  if (seg) { seg.classList.remove('flash'); void seg.offsetWidth; seg.classList.add('flash'); }
}

/* ----- actions ----- */
document.addEventListener('click', (e) => {
  const hit = e.target.closest('[data-action]');
  if (!hit) return;
  const action = hit.dataset.action;
  const id = hit.dataset.id;

  switch (action) {
    case 'select':
      if (id) selectTask(id);
      break;
    case 'close-inspector':
      state.inspectorOpen = false;
      $('#shell').classList.add('inspector-closed');
      break;
    case 'tab':
      state.tab = hit.dataset.tab;
      renderInspector();
      break;
    case 'toggle-run':
      if (state.run.status === 'stopped') { toast('运行已停止，请新建运行', 'warn'); break; }
      state.paused = !state.paused;
      renderChrome(); renderBoard(); renderInspector();
      toast(state.paused ? '运行已暂停，当前迭代会跑完' : '运行已恢复', state.paused ? 'warn' : 'success');
      break;
    case 'stop-run':
      openStop();
      break;
    case 'confirm-stop':
      confirmStop();
      break;
    case 'config':
      openConfig();
      break;
    case 'save-config':
      closeModal();
      toast('流水线配置已保存', 'success');
      break;
    case 'new-run':
      openNewRun();
      break;
    case 'plan-start':
      startPlan();
      break;
    case 'focus-lane':
      focusLane(hit.dataset.lane);
      break;
    case 'start-task': {
      const t = taskById(id);
      if (!t) break;
      moveTask(t, 'implementing', 2);
      t.iteration = 1;
      t.worktree = `.spacecode/worktrees/${t.num}`;
      addEvent(t, 'run', '引擎启动 · 实现 迭代 1/5');
      refreshAll();
      toast(`#${t.num} 已开始实现`, 'success');
      break;
    }
    case 'merge':
      openMerge(id);
      break;
    case 'confirm-merge':
      confirmMerge();
      break;
    case 'fix-agent': {
      const t = taskById(id);
      if (!t) break;
      moveTask(t, 'implementing', 2);
      t.iteration = 1;
      t.attention = null;
      if (t.review) t.review.verdict = 'needs_changes';
      addEvent(t, 'run', '已把修改意见交回 Agent，进入迭代 1/5');
      refreshAll();
      toast(`已把意见交回 #${t.num}，worktree 保留`, 'success');
      break;
    }
    case 'approve-review': {
      const t = taskById(id);
      if (!t) break;
      if (t.review && t.review.comments.some(c => c.status === 'open')) {
        toast('仍有未处理的审查意见', 'warn');
        break;
      }
      moveTask(t, 'mergeable', 5);
      if (t.review) t.review.verdict = 'approved';
      t.attention = null;
      addEvent(t, 'ok', '审查通过 · 进入合并队列');
      refreshAll();
      toast(`#${t.num} 审查通过，已进入合并队列`, 'success');
      break;
    }
    case 'takeover':
      openTakeover(id);
      break;
    case 'return-flow':
      returnFlow(id);
      break;
    case 'open-worktree':
      openWorktree(id);
      break;
    case 'cancel-task': {
      const t = taskById(id);
      if (!t) break;
      moveTask(t, 'done', 6);
      t.cancelled = true;
      t.attention = null;
      addEvent(t, 'warn', '任务被放弃');
      refreshAll();
      toast(`已放弃 #${t.num}，worktree 保留在磁盘`, 'warn');
      break;
    }
    case 'address-comment':
    case 'dismiss-comment': {
      const t = taskById(id);
      if (!t) break;
      const c = t.review.comments[Number(hit.dataset.comment)];
      c.status = action === 'address-comment' ? 'accepted' : 'dismissed';
      addEvent(t, 'ok', action === 'address-comment' ? '审查意见已标记为待修复' : '审查意见已忽略');
      renderInspector();
      refreshChrome();
      toast(action === 'address-comment' ? '已加入修复清单' : '已忽略该意见');
      break;
    }
    case 'copy':
      try { navigator.clipboard.writeText(hit.dataset.copy); } catch (_) {}
      toast('已复制' + (hit.dataset.label ? ' ' + hit.dataset.label : ''));
      break;
    case 'show-board':
      showBoardView();
      break;
    case 'show-setup':
      openSetup(state.setupStep);
      break;
    case 'restart-setup':
      closeModal();
      state.setup.done = false;
      openSetup(1);
      break;
    case 'setup-step':
      state.setupStep = Number(hit.dataset.step) || 1;
      renderSetup();
      break;
    case 'setup-next':
      state.setupStep = Math.min(4, state.setupStep + 1);
      renderSetup();
      break;
    case 'setup-prev':
      state.setupStep = Math.max(1, state.setupStep - 1);
      renderSetup();
      break;
    case 'setup-complete':
      completeSetup();
      break;
    case 'set-agent':
      state.setup.agent = hit.dataset.value;
      renderSetup();
      break;
    case 'set-sandbox':
      state.setup.sandbox = hit.dataset.value;
      renderSetup();
      break;
    case 'set-tracker':
      state.setup.tracker = hit.dataset.value;
      renderSetup();
      break;
    case 'auth-method':
      state.setup.authMethod = hit.dataset.value;
      renderSetup();
      break;
    case 'toggle-token':
      state.setup.tokenVisible = !state.setup.tokenVisible;
      renderSetup();
      break;
    case 'toggle-guide':
      state.setup.showGuide = !state.setup.showGuide;
      renderSetup();
      break;
    case 'test-token':
      testToken();
      break;
    case 'demo-token':
      state.setup.token = 'github_pat_11AA7DEMOonlyForPrototype';
      state.setup.tokenStatus = 'idle';
      state.setup.tokenVisible = false;
      renderSetup();
      toast('已填入示例 Token，点“测试连接”验证');
      break;
    case 'check-gh':
      checkGh();
      break;
    case 'retry-docker':
      state.setup.sandbox = 'docker';
      state.setup.dockerStatus = 'checking';
      renderSetup();
      setTimeout(() => {
        state.setup.dockerStatus = 'running';
        renderSetup();
        toast('已检测到 Docker Desktop', 'success');
      }, 800);
      break;
    case 'open-model-settings':
      toast('打开设置 → 模型配置（原型不跳转）');
      break;
    case 'done-plan':
      showBoardView();
      setTimeout(openNewRun, 200);
      break;
    case 'close-modal':
      if (state.takeoverId) state.takeoverId = null;
      closeModal();
      renderBoard();
      break;
    case 'demo-step':
      demoStep();
      break;
    case 'reset':
      state = freshState();
      $('#shell').classList.remove('inspector-closed');
      refreshAll();
      syncThemeButton();
      toast('已重置演示数据');
      break;
    case 'theme':
      toggleTheme();
      break;
    case 'noop':
      if (hit.classList.contains('switch')) hit.classList.toggle('on');
      break;
    default:
      break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('#overlay-root').innerHTML) {
      if (state.takeoverId) { state.takeoverId = null; renderBoard(); }
      closeModal();
    } else if (state.inspectorOpen) {
      state.inspectorOpen = false;
      $('#shell').classList.add('inspector-closed');
    }
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'merge-ack') {
    const btn = $('#merge-confirm');
    if (btn) btn.disabled = !e.target.checked;
  }
  if (e.target.classList.contains('plan-check')) {
    const n = document.querySelectorAll('.plan-check:checked').length;
    const el = $('#plan-count');
    if (el) el.textContent = `已选择 ${n} 个任务`;
  }
  if (e.target.id === 'setup-label') state.setup.label = e.target.value;
  if (e.target.id === 'setup-comment') state.setup.commentIssue = e.target.checked;
  if (e.target.id === 'setup-close') state.setup.closeIssue = e.target.checked;
  if (e.target.name === 'setup-merge') state.setup.mergeMode = e.target.value;
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'gh-token') {
    state.setup.token = e.target.value;
    if (state.setup.tokenStatus !== 'idle') state.setup.tokenStatus = 'idle';
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'takeover-form') return;
  e.preventDefault();
  const input = $('#takeover-input');
  const text = input.value.trim();
  if (!text) return;
  const scroll = $('#chat-scroll');
  const user = document.createElement('div');
  user.className = 'msg user';
  user.innerHTML = `<div class="avatar">你</div><div class="bubble">${escapeHTML(text)}</div>`;
  scroll.appendChild(user);
  input.value = '';
  scroll.scrollTop = scroll.scrollHeight;
  setTimeout(() => {
    const reply = document.createElement('div');
    reply.className = 'msg agent';
    reply.innerHTML = `<div class="avatar">AI</div><div class="bubble">收到。我会先核对 <code>sessionRestore</code> 的读取顺序，再跑一遍 <code>test:changed</code>；结果同步到任务事件流。</div>`;
    scroll.appendChild(reply);
    scroll.scrollTop = scroll.scrollHeight;
  }, 700);
});

/* ============================================================
   演示推进 / 计时
   ============================================================ */
function demoStep() {
  const t = state.tasks.find(x => x.lane === 'implementing' && x.id !== state.takeoverId);
  if (!t) { toast('当前没有实现中的任务', 'warn'); return; }
  if (t.iteration < t.maxIter) {
    t.iteration += 1;
    t.elapsed += 35;
    addEvent(t, 'run', `实现 迭代 ${t.iteration}/${t.maxIter} · 继续修改`);
    if (t.iteration >= 3) addEvent(t, 'ok', '编辑 <code>src/stores/turn/index.ts</code> (+6 −2)');
  } else {
    moveTask(t, 'reviewing', 4);
    t.tests = { status: 'pass', name: 'npm run test:changed', detail: '51 passed · 44s' };
    t.review = {
      verdict: 'needs_changes',
      summary: '实现可读性不错，但边界条件还缺一个用例，另有一处命名需要调整。',
      comments: [
        { file: 'src/stores/turn/index.ts', line: 214, body: 'abort 分支需要补一个恢复后不重复发送的用例。', status: 'open' },
        { file: 'src/stores/chatSession.ts', line: 871, body: '变量名 session 与 store 同名，容易误读。', status: 'open' }
      ]
    };
    t.attention = { reason: '审查要求修改', action: 'fix' };
    addEvent(t, 'run', '实现完成，进入审查阶段');
    addEvent(t, 'run', '审查 产出 2 条行内意见');
  }
  refreshAll();
}

let tick = 0;
setInterval(() => {
  if (state.run.status !== 'running' || state.paused) return;
  tick += 1;
  state.tickCount += 1;
  state.run.runElapsed += 5;
  if (tick % 4 === 0) state.run.spend = +(state.run.spend + 0.03).toFixed(2);

  let changed = false;
  state.tasks.filter(t => t.lane === 'implementing' && t.id !== state.takeoverId).forEach(t => {
    t.elapsed += 5;
    changed = true;
    if (tick % 3 === 0) {
      addEvent(t, 'run', ['读取 <code>docs/adr/0011-tests-must-cross-the-seam.md</code>', '编辑 <code>src/stores/turn/index.ts</code> (+6 −2)', '运行 <code>npm run test:changed</code>'][tick % 3]);
    }
  });
  if (!changed) return;

  const spend = $('#stat-spend');
  if (spend) spend.textContent = `$${state.run.spend.toFixed(2)}`;
  const el = $('#stat-elapsed');
  if (el) el.textContent = `${Math.floor(state.run.runElapsed / 60)}m`;
  document.querySelectorAll('[data-elapsed-id]').forEach(node => {
    const t = taskById(node.dataset.elapsedId);
    if (t) node.textContent = fmt(t.elapsed);
  });
  if (state.tab === 'events') renderInspector();
}, 5000);

/* ============================================================
   主题
   ============================================================ */
function toggleTheme() {
  const root = document.documentElement;
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  syncThemeButton();
}
function syncThemeButton() {
  const btn = $('#theme-btn');
  if (!btn) return;
  const dark = document.documentElement.dataset.theme === 'dark';
  btn.innerHTML = icon(dark ? 'sun' : 'moon') + `<span>${dark ? '浅色' : '深色'}</span>`;
}

/* ============================================================
   启动
   ============================================================ */
const params = new URLSearchParams(location.search);
if (params.get('theme') === 'dark') {
  document.documentElement.dataset.theme = 'dark';
}
state = freshState();
refreshAll();
syncThemeButton();
const demo = params.get('demo');
if (demo === 'merge') setTimeout(() => openMerge('405'), 30);
if (demo === 'takeover') setTimeout(() => openTakeover('412'), 30);
if (demo === 'plan') setTimeout(openNewRun, 30);
if (demo === 'config') setTimeout(openConfig, 30);
if (demo === 'setup') setTimeout(() => openSetup(1), 30);
if (demo === 'setup2') setTimeout(() => openSetup(2), 30);
if (demo === 'setup3') setTimeout(() => { state.setup.showGuide = true; openSetup(3); }, 30);
if (demo === 'setup3-ok') setTimeout(() => {
  state.setup.token = 'github_pat_demo';
  state.setup.tokenStatus = 'ok';
  state.setup.tokenIdentity = '@hjdspace';
  state.setup.tokenIssues = 12;
  state.setup.tokenLabelCount = 3;
  openSetup(3);
}, 30);
if (demo === 'setup4') setTimeout(() => {
  state.setup.token = 'github_pat_demo';
  state.setup.tokenStatus = 'ok';
  state.setup.tokenIdentity = '@hjdspace';
  state.setup.tokenIssues = 12;
  state.setup.tokenLabelCount = 3;
  openSetup(4);
}, 30);
if (demo === 'setup-done') setTimeout(() => {
  state.setup.tokenStatus = 'ok';
  state.setup.done = true;
  openSetup(4);
}, 30);
</script>
